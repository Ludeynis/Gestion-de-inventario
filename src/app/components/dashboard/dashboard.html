<h3>Detalles de los productos </h3>

<div class="metricas">
    <mat-card>
        <mat-card-content>
            <h3>Total de productos</h3>
            <p>Total de productos: {{totalProductos()}}</p>
        </mat-card-content>
    </mat-card>

    <mat-card>
        <mat-card-content>
            <h3>Stock bajo</h3>
            <p>Stock bajo: {{stockBajo()}}</p>
        </mat-card-content>
    </mat-card>

    <mat-card>
        <mat-card-content>
            <h3>Productos agotados</h3>
            <p>Productos agotados: {{productosAgotados()}}</p>
        </mat-card-content>
    </mat-card>

    <mat-card>
        <mat-card-content>
            <h3>Valor total del inventario</h3>
            <p>Valor de los productos en total: {{valorTotal()}}</p>
        </mat-card-content>
    </mat-card>

</div>
