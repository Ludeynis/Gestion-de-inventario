<h2 class="titulo">Resumen del inventario</h2>

<div class="metricas">
    <mat-card>
        <mat-card-content>
            <mat-icon>inventory_2</mat-icon>
            <p class="cifra">{{ totalProductos() }}</p>
            <p class="etiqueta">Total de productos</p>
        </mat-card-content>
    </mat-card>

    <mat-card>
        <mat-card-content>
            <mat-icon>warning</mat-icon>
            <p class="cifra">{{ stockBajo() }}</p>
            <p class="etiqueta">Stock bajo</p>
        </mat-card-content>
    </mat-card>

    <mat-card class="alerta">
        <mat-card-content>
            <mat-icon>block</mat-icon>
            <p class="cifra">{{ productosAgotados() }}</p>
            <p class="etiqueta">Productos agotados</p>
        </mat-card-content>
    </mat-card>

    <mat-card>
        <mat-card-content>
            <mat-icon>euro</mat-icon>
            <p class="cifra">{{ valorTotal() | currency:'EUR' }}</p>
            <p class="etiqueta">Valor total del inventario</p>
        </mat-card-content>
    </mat-card>
</div>
